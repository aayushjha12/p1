<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <nav>
            <h1 class="logo">NETFLIX</h1>
            <button>Sign In</button>
        </nav>

        <div class="hero-content">
            <h2>Unlimited Movies, TV Shows and More.</h2>
            <p>Watch anywhere. Cancel anytime.</p>
            <button class="btn">Get Started</button>
        </div>
    </header>

    <!-- Cards Section -->
    <section class="movies">
        <h2>Popular on Netflix</h2>

        <div class="movie-grid">

            <div class="card">
                <img src="https://picsum.photos/300/400?1" alt="">
                <h3>Movie One</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/400?2" alt="">
                <h3>Movie Two</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/400?3" alt="">
                <h3>Movie Three</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/400?4" alt="">
                <h3>Movie Four</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/400?5" alt="">
                <h3>Movie Five</h3>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/400?6" alt="">
                <h3>Movie Six</h3>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Netflix Clone | Designed with HTML & CSS</p>
    </footer>

</body>
</html>
